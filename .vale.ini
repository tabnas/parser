# Prose gate. Runs over the reader-facing pages in CI; see
# ci/workflows/docs.yml (staged) and docs/STYLE-GUIDE.md.
#
# Precedence, decided deliberately and recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google (developers.google.com/style) is the base for everything the
# house guide is silent on. Where the two collide the house voice wins,
# and every such override is listed below with its reason, so a reader
# who wonders why a Google rule is off finds the answer here rather than
# guessing it is an oversight.
#
# Every count in this file is what Vale reports on a clean run over the
# gated set today: 1217 alerts across 21 files. A rule demoted without
# that number reads later as an oversight and gets re-promoted by
# somebody repeating the work, and a number nothing re-measures goes
# stale the first time a page is edited. `node ts/scripts/vale-counts.cjs`
# checks every one of them against a live run, `--write` re-measures, and
# the docs workflow fails on drift.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Tabnas
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever
# the package registry serves at sync time, so a Google release could
# add or change an error-level rule and turn an unrelated docs pull
# request red -- exactly the nondeterminism pinning the BINARY was
# supposed to prevent. Pinning one without the other prevents half of
# it.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Tabnas

# --- Scope ------------------------------------------------------------
#
# Vale is handed an EXPLICIT FILE LIST, printed by
# `ts/scripts/gated-docs.cjs` and shared with ts/test/docs.test.js, so
# the two gates cannot disagree about which pages they cover.
#
# It is not done with `[section]` headers here, and that is not a style
# preference: Vale selects sections by file EXTENSION, so a header like
# `[doc/rust-port-**]` matches nothing and the working documents get
# linted anyway, in silence.

# --- Overrides where the house voice wins ------------------------------
#
# These rules encode Google's house style rather than correctness, and
# each would flatten a voice choice the guide makes on purpose.

# "We" is allowed in TUTORIALS ONLY, where the page walks through code
# with the reader (STYLE-GUIDE.md, voice rule 7). Vale cannot express
# "only in tutorials", so the rule is off here and the restriction is
# carried by docs.test.js `we-appears-only-in-tutorials`, which knows
# which page is which.
# 0 hits.
Google.We = NO

# "I" appears nowhere in the docs by house rule, which is STRICTER than
# Google's. docs.test.js `first-person-singular-appears-nowhere` covers
# it, including `my` and `mine`, and does not fire on the `I` inside
# quoted CLI output the way this rule does. 0 hits.
#
# Switching a Google rule off in favour of a house rule means the house
# rule has to be real: the named test is the receipt.
Google.FirstPerson = NO

# British spellings (-ise, -isation, colour). Google style is US
# English; the house voice is not, and the precedence above puts the
# house voice first. 5 hits, every one of them deliberate
# (`recognise`, `organised`, `unrecognised`, `recognised`, `colour`).
# Actual misspellings are caught by Vale.Spelling, which stays at error.
Google.Spelling = NO

# The house guide bans em dashes outright. Google's rule is about
# SPACING around them, which is redundant under a ban, and it cannot
# see the ones inside quoted output that the ban exempts. 424 in the
# gated set at the base commit, all rewritten in the pass that added
# this gate. The ban itself is carried by docs.test.js
# `no-em-dashes-in-prose`, which strips code and quoted output first.
# 0 hits.
Google.EmDash = NO

# The house voice alternates long explanatory sentences with short
# verdicts, and the occasional passive is how a sentence keeps its
# subject on the thing being documented ("the token is discarded").
# 277 hits, almost all of them fine. Advisory only, never a gate.
Google.Passive = suggestion

# Contractions are a register choice per document kind, not a rule:
# tutorials contract, reference pages do not. 175 hits, none of them
# defects. Advisory only.
Google.Contractions = suggestion

# Voice rule 4 rations parentheses more precisely than "use parentheses
# judiciously" can: definitions, caveats, and at most one dry aside per
# page, with reference pages carrying facts only. 375 hits.
Google.Parens = suggestion

# A semicolon joining two independent clauses is part of the long
# explanatory sentence in voice rule 6. 118 hits. Advisory.
Google.Semicolons = suggestion

# --- The gate ----------------------------------------------------------
#
# Error level, and these fail CI. They are conventions a reader benefits
# from and an author has no reason to vary.

Google.Latin = error
Google.Ellipses = error
Tabnas.WordChoice = error

# Vale's dictionary, plus .vale/styles/config/vocabularies/Tabnas. 118
# domain terms are accepted there by name; a 119th is a typo until
# somebody adds it, which is the point of keeping this at error.
Vale.Spelling = error

# The banned list, read from reject.txt in the same vocabulary
# directory. ts/test/docs.test.js reads that identical file, so the two
# gates cannot disagree about what is banned. 0 hits. The six it found
# at the base commit were every one of them real, and were rewritten:
# 4x `not just`, 2x `quietly`.
Vale.Avoid = error

# --- Demoted on evidence, not on taste --------------------------------
#
# Each of these was tried at error level against the real pages first.
# They are warnings because they were WRONG here, not because they were
# inconvenient; the count is what each produced on a clean run.

# Wants JSON, CSV, XML, TOML, YAML, ABNF, EBNF, GBNF, LSP and API
# spelled out. 111 hits, all standard terms for a reader who is
# comparing grammar notations, which is what this engine is for.
Google.Acronyms = warning

# Sentence case in headings, which the guide requires. It cannot know
# that Go, TypeScript, Rust and the grammar names are proper nouns. 55
# hits.
Google.Headings = warning

# Maps `touch` to `tap`, a mobile-UI rule, and `above`/`below` to
# `preceding`/`following`. 46 hits, mostly ordinary cross-references
# inside single long reference pages. The one substitution that does
# hold is carried at error level by Tabnas.WordChoice.
Google.WordListCase = warning

# US convention: commas and periods INSIDE the quotation marks. The
# house voice is not US English -- the same call as the -ise spellings
# -- and putting a period inside a quoted `code span` is actively wrong
# when the quote is a literal. 19 hits.
Google.Quotes = warning

# "Avoid the unverifiable claim 'guarantee'." 11 hits, and the subject
# matter is what a parser promises about a grammar: "the ordering
# guarantee", "no guarantee the rule closes". A gate that fires on the
# subject matter is a gate people learn to switch off.
Google.ExcessiveClaims = warning

# Fires on a colon followed by a proper noun -- "'TypeScript' should be
# in lowercase", "'Go' should be in lowercase". 10 hits, 10 false:
# every one is a proper noun.
Google.Colons = warning

# Serial commas, which the guide requires. 5 hits, all two-item lists
# sitting after a comma clause, which the rule cannot tell from a list.
# Kept as a warning an author reads, not a gate.
Google.OxfordComma = warning

# Flags "sees" and "tells" as attributing human qualities to software.
# 4 hits, and half are about PEOPLE, which the rule cannot tell apart
# from "the lexer sees".
Google.Anthropomorphism = warning

# Flags an `-ly` adverb before a hyphen ("newly-created"), a real error
# class, but it cannot tell an adverb from a word that merely ends in
# those two letters. It was right about both of its hits here, and they
# were fixed rather than excused. 0 hits.
Google.LyHyphens = warning

# "Don't use plurals in parentheses such as in 'tag(s)'." 2 hits, both
# in a reference page listing what an option accepts, where the
# parenthetical plural is the shortest true statement.
Google.OptionalPlurals = warning

# "Put a nonbreaking space between the number and the unit." 1 hit,
# inside a quoted token offset.
Google.Units = warning

# Fires on `g.I` and `g.F` inside a quoted Go struct literal. 2 hits, 2
# false: the rule cannot see that the span is code.
Google.Spacing = warning

# "Avoid using 'will'." 5 hits, each on a consequence that follows
# later: what a subsequent call does with what this one returned, what a
# shared grammar does across the two runtimes, and what the engine does
# not promise.
Google.Will = warning

# "Avoid time-based words like 'currently'." 1 hit, on a version number
# that is expected to change, which is the case the word is for.
Google.Timeless = warning
