[package]
name = "tabnas"
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "A dynamic JSON parser that isn't strict and can be customized."
license = "MIT"
repository = "https://github.com/tabnas/parser"
readme = "README.md"
keywords = ["parser", "grammar", "json"]
categories = ["parsing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.10"
indexmap = { version = "2.2", features = ["serde"] }
