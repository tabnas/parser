# PROPOSED workflow -- lives in ci/workflows/ for review; move to
# .github/workflows/deps.yml to activate. It was staged here when
# session credentials could not write .github/workflows/*. Under admin
# DECISIONS.md ADR-8 as amended (2026-09-24) staging is optional, and
# moving it is an ordinary reviewed pull request.
#
# The dependency-source gate. A committed dependency must name a published
# package or a GitHub reference; local wiring is undone before the commit.
#
# Separate from ci.yml because it is neither a platform check nor a port
# check: one runner, one job, no matrix, no toolchain but node. It runs on
# EVERY push and pull request with no path filter, deliberately -- the
# files it judges are every npm manifest, every lockfile, every go.mod and
# Cargo.toml, .npmrc, and every committed symlink or archive in the tree,
# and a path list would have to be complete to be safe. A new module
# directory carrying a `replace` to a sibling is exactly the case a stale
# path list would wave through.
name: deps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      # The gate reads `git ls-files`, so it needs a real checkout rather
      # than a snapshot -- but only this commit's index, so depth 1 is
      # enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.x'

      # Its own suite first: a gate that cannot fail is not a gate, and a
      # green tree says nothing about whether the check still works.
      - name: Gate self-test
        run: make deps-test

      - name: Dependency sources
        run: make deps
