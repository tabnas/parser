# PROPOSED workflow — lives in ci/workflows/ for review; move to
# .github/workflows/fleet.yml to activate. Session credentials cannot
# write .github/workflows/* (admin DECISIONS.md ADR-8), so promotion is a
# maintainer step via tabnas/admin rollout/apply-ci-folders.sh.
#
# What it closes: nothing in CI today runs a downstream grammar's own
# suite against the engine under test. build.yml clones four repos and
# tests none of them; the staged gate.yml would add json and jsonic —
# two of thirty. So an engine change can pass every check here and still
# break a published grammar, and the first anyone hears of it is after
# the release.
#
# That is not hypothetical. @tabnas/parser 0.9.1 shipped a regression in
# expression precedence: with expr at ANY published version, `1+2*3`
# parses to ["*",2,3] — the `1 +` is dropped. expr's own suite fails 16
# tests on it and passes on 0.9.0, so this workflow would have caught it
# on the pull request.
#
# **It opens RED on main today**, for that same regression — the gate is
# working, the engine is not. Promote it once the precedence fix lands, or
# promote it now as visible-but-not-required and let the red row be the
# reminder. The same caveat is on gate.yml, for the same kind of reason.
#
# Two jobs, deliberately:
#
#   fleet-pr  — a small, fast arm on every PR, over the packages an
#               engine change is most likely to break. It is meant to be
#               required.
#   fleet-all — the whole fleet, nightly and on demand. Thirty repos in
#               two runtimes is minutes, and it clones at each package's
#               LATEST release, so it can go red because someone else
#               published — which is information, but not a reason to
#               block an unrelated PR. Keep it visible, not required.
name: fleet

on:
  pull_request:
  schedule:
    # 03:17 UTC — off the hour, so this does not queue behind everything
    # else in the org that picked midnight.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated packages (blank = the whole fleet)'
        required: false
        default: ''
      runtime:
        description: 'ts, go, or both'
        required: false
        default: 'both'
      record_timings:
        description: 'Append suite timings to ci/fleet/timings.tsv (a deliberate measurement, not something a routine run should leave behind)'
        required: false
        type: boolean
        default: false

jobs:
  # The PR arm: the base grammars plus the plugins that layer on them,
  # which between them exercise the rule table, the lexer, precedence and
  # the ABNF compiler. run-fleet.sh pulls in each one's base chain, so
  # naming expr also builds jsonic and json.
  fleet-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Use LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install the engine's TS toolchain
        run: cd ts && npm i
      - name: Fleet gate (core packages)
        run: ci/fleet/run-fleet.sh --only json,jsonic,expr,abnf,semver,csv,xml

  fleet-all:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Thirty clones, thirty npm installs and two toolchains. The default
    # 360 is generous enough to hide a hang.
    timeout-minutes: 60
    steps:
      - name: Use LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install the engine's TS toolchain
        run: cd ts && npm i
      # --update-lock writes the resolved versions as the run finishes, so
      # the artifact below records WHICH releases were tested. A red run
      # three weeks from now is only diagnosable against what was green
      # before it.
      #
      # The dispatch inputs go through the environment rather than into the
      # command line: ${{ }} is substituted before the shell parses the
      # line, so an input interpolated there is shell source, not an
      # argument.
      # Timings are printed by every run and RECORDED only when a person
      # asks. A scheduled run appending a row nightly would fill the file
      # with measurements nobody took, on a runner whose speed nobody
      # controls — which is the opposite of a record worth comparing.
      - name: Fleet gate (everything)
        env:
          FLEET_ONLY: ${{ github.event.inputs.only }}
          FLEET_RUNTIME: ${{ github.event.inputs.runtime || 'both' }}
          FLEET_RECORD: ${{ github.event.inputs.record_timings }}
        run: |
          # An explicit if, not `[ … ] && extra+=(…)`: the && form leaves the
          # statement with exit 1 when the condition is false, which is a
          # trap under the runner's `bash -e`.
          extra=()
          if [ "$FLEET_RECORD" = "true" ]; then
            extra+=(--record-timings)
          fi
          ci/fleet/run-fleet.sh \
            --only "$FLEET_ONLY" \
            --runtime "$FLEET_RUNTIME" \
            --update-lock "${extra[@]}"

      # The versions tested, and the output of anything that failed. The
      # checkout is ephemeral, so a log not uploaded here cannot be read
      # after the job ends.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-results
          path: |
            ci/fleet/fleet.lock
            ci/fleet/.work/.logs/
          if-no-files-found: ignore
