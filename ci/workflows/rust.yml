# PROPOSED workflow — lives in ci/workflows/ for review; move to
# .github/workflows/rust.yml to activate, per ADR-8.
name: rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
    - name: Use LF line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v4
      with:
        path: parser
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Set up Rust MSRV
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: '1.85'
        components: rustfmt, clippy
    - name: Clone strict-JSON grammar
      shell: bash
      run: git clone --depth 1 https://github.com/tabnas/json.git json
    - name: Install TypeScript dependencies
      shell: bash
      run: |
        ( cd parser/ts && npm ci )
        ( cd json/ts && npm ci )
    - name: Build TypeScript token dumper
      shell: bash
      run: cd parser/ts && npm run build
    - name: Run Rust and three-runtime parity gates
      shell: bash
      run: parser/ci/rust/run.sh
