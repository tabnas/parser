# Promoted from ci/workflows/ per ADR-8; this is the live gate.
name: rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
    - name: Use LF line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        path: parser
    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: 24.x
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
      with:
        go-version: '1.24'
    # rustup, NOT dtolnay/rust-toolchain: these repos allow only
    # GitHub-owned and verified-creator actions (allowed_actions:
    # selected, patterns_allowed: []), so that action is refused before
    # any job starts -- the run reports startup_failure, which reads as
    # a broken workflow file rather than a blocked action. The runners
    # ship rustup, so the action was buying nothing here.
    #
    # `default` is what makes the MSRV the toolchain the gate runs
    # under; installing it alone leaves cargo on the runner's
    # pre-installed stable.
    - name: Set up Rust MSRV
      run: |
        rustup toolchain install 1.85 --profile minimal --component rustfmt,clippy
        rustup default 1.85
    - name: Clone serialized grammar producers
      shell: bash
      run: |
        git clone --depth 1 https://github.com/tabnas/json.git json
        git clone --depth 1 https://github.com/tabnas/bnf.git bnf
        git clone --depth 1 https://github.com/tabnas/abnf.git abnf
        git clone --depth 1 https://github.com/tabnas/ebnf.git ebnf
        git clone --depth 1 https://github.com/tabnas/gbnf.git gbnf
        # Not a grammar producer: ci/parity/run-parity.sh builds gotokdump
        # in a Go workspace that includes ../jsonic/go, so without this
        # clone the parity step dies at `go work init`.
        git clone --depth 1 https://github.com/tabnas/jsonic.git jsonic
    - name: Install TypeScript dependencies
      shell: bash
      run: |
        # `npm ci` only where the repo tracks a lockfile, which is json
        # alone: parser's ts/.gitignore ignores package-lock.json, so
        # `npm ci` in parser/ts exits with EUSAGE on every runner.
        ( cd parser/ts && npm install )
        ( cd json/ts && npm ci )
        ( cd bnf/ts && npm install )
        ( cd abnf/ts && npm install )
        ( cd ebnf/ts && npm install )
        ( cd gbnf/ts && npm install )
    - name: Wire and build working-tree TypeScript engines
      shell: bash
      run: |
        . parser/ci/lib/wire.sh
        # json/ts is what ci/parity/tokdump.js requires, so it must be
        # built, and against the working-tree engine like the rest.
        link_ts_dep json/ts parser "$PWD/parser/ts"
        link_ts_dep bnf/ts parser "$PWD/parser/ts"
        link_ts_dep abnf/ts parser "$PWD/parser/ts"
        link_ts_dep abnf/ts bnf "$PWD/bnf/ts"
        link_ts_dep ebnf/ts parser "$PWD/parser/ts"
        link_ts_dep ebnf/ts bnf "$PWD/bnf/ts"
        link_ts_dep gbnf/ts parser "$PWD/parser/ts"
        link_ts_dep gbnf/ts bnf "$PWD/bnf/ts"
        ( cd parser/ts && npm run build )
        ( cd json/ts && npm run build )
        ( cd bnf/ts && npm run build )
        ( cd abnf/ts && npm run build )
        ( cd ebnf/ts && npm run build )
        ( cd gbnf/ts && npm run build )
    - name: Run Rust and three-runtime parity gates
      shell: bash
      run: parser/ci/rust/run.sh
