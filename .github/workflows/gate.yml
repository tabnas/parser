# Promoted from ci/workflows/ per ADR-8; this is the live gate.
#
# The engine conformance gate. This repo's own fixtures are strict JSON
# only; this workflow also runs the DOWNSTREAM json + jsonic suites
# (both runtimes) against the engine under test —
# ~2,300 shared TSV rows plus ~1,500 unit tests, including the
# error-code parity contract — plus the fixture-corpus sync check, the
# cross-runtime token-stream parity check and a generated value diff.
#
# Note: cloning downstreams at main couples engine PRs to downstream
# health. If a broken downstream main starts blocking engine work, pin
# the clone refs or mark this job non-required-but-visible.
name: gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
    - name: Use LF line endings
      run: git config --global core.autocrlf false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: parser
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: 24.x
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: '1.24'
    - name: Clone downstream repos
      shell: bash
      run: |
        set -e
        # json + jsonic: the suites under test. debug: jsonic's api, custom
        # and debug tests require @tabnas/debug. bnf + abnf: this repo's
        # README doc-examples require @tabnas/abnf, resolved from the
        # sibling checkout (ts/test/doc-examples.test.js), and abnf needs
        # bnf. run-gate.sh links each of them to these working trees and
        # builds them in ci.yml's build-order (parser bnf debug abnf).
        for dep in bnf debug abnf json jsonic; do
          git clone --depth 1 "https://github.com/tabnas/$dep.git" "$dep"
        done
    - name: Install TS toolchains
      shell: bash
      run: |
        set -e
        for pkg in parser bnf debug abnf json jsonic; do
          ( cd "$pkg/ts" && npm i )
        done
    - name: Run gate (all suites, both runtimes, fixture sync)
      id: gate
      shell: bash
      run: parser/ci/gate/run-gate.sh "$GITHUB_WORKSPACE"

    # The checks below are independent of the suites above, so each one
    # runs whenever the gate step itself ran (it builds what they read),
    # pass or fail. Chained on success instead, one red downstream test
    # hid all three, and a broken corpus path in one of them went unseen.

    # The jsonic corpus lives in the jsonic repo — pass it explicitly.
    # Omitting it defaults to this repo's test/spec, which since the
    # corpora split holds only the engine's own strict-JSON and utility
    # fixtures: the relaxed inputs that actually drive the jsonic lexer
    # would silently stop being exercised.
    - name: Token-stream parity (jsonic grammar over jsonic fixtures)
      if: ${{ !cancelled() && steps.gate.outcome != 'skipped' }}
      shell: bash
      run: parser/ci/parity/run-parity.sh jsonic "$GITHUB_WORKSPACE/jsonic/test/spec"

    - name: Token-stream parity (json grammar over json fixtures)
      if: ${{ !cancelled() && steps.gate.outcome != 'skipped' }}
      shell: bash
      run: parser/ci/parity/run-parity.sh json "$GITHUB_WORKSPACE/json/test/spec"

    - name: Cross-runtime value diff (generated corpus)
      if: ${{ !cancelled() && steps.gate.outcome != 'skipped' }}
      shell: bash
      run: parser/ci/fuzz/run-diff.sh 500
