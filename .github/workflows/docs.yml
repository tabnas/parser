# The prose gate. Vale over the reader-facing pages, at the levels set
# in .vale.ini.
#
# Separate from ci.yml because it is neither a platform check nor a port
# check: one runner, one job, no matrix. It runs on documentation and
# configuration changes only, so a code-only pull request does not wait
# on it.
name: Docs

# Runs on EVERY branch push, not just main, and the path lists are
# written out twice.
#
# Both of those are deliberate. GitHub Actions does not support YAML
# anchors, so a version of this file that shared one path list between
# the two triggers does not run at all. Restricting `push` to main and
# leaning on `pull_request` for branches is the other failure: a gate
# that reaches a pull request showing green because it never executed is
# worse than no gate, so this one triggers the way ci.yml does.
on:
  push:
    paths:
      - 'doc/**'
      - 'go/doc/**'
      - 'ts/doc/**'
      - 'README.md'
      - 'go/README.md'
      - 'rs/README.md'
      - 'ts/README.md'
      - 'docs/STYLE-GUIDE.md'
      - 'ts/scripts/gated-docs.cjs'
      - 'ts/scripts/vale-counts.cjs'
      - '.vale.ini'
      - '.vale/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'doc/**'
      - 'go/doc/**'
      - 'ts/doc/**'
      - 'README.md'
      - 'go/README.md'
      - 'rs/README.md'
      - 'ts/README.md'
      - 'docs/STYLE-GUIDE.md'
      - 'ts/scripts/gated-docs.cjs'
      - 'ts/scripts/vale-counts.cjs'
      - '.vale.ini'
      - '.vale/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.x'

      # Pinned. Vale ships new rules in the Google package as well as in
      # the binary, and an unpinned gate turns someone else's release
      # into a red build on a pull request that touched one word. The
      # package is pinned by URL in .vale.ini for the same reason.
      - name: Install Vale
        env:
          VALE_VERSION: '3.9.1'
        run: |
          curl -sSfL -o vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/
          vale --version

      # Downloads the Google package into .vale/styles/, which is
      # gitignored -- the vocabulary under .vale/styles/config/ and the
      # house rule under .vale/styles/Tabnas/ are ours and are committed.
      - name: Sync Vale packages
        run: vale sync

      # The file list comes from ts/scripts/gated-docs.cjs, the same
      # module ts/test/docs.test.js reads, so the two gates cannot
      # disagree about which pages they cover. It is not expressible as
      # a Vale config section: Vale selects sections by file extension,
      # not by path.
      - name: Prose gate
        run: vale --minAlertLevel=error $(node ts/scripts/gated-docs.cjs)

      # .vale.ini justifies every demoted rule with the number of alerts
      # it produced here, and docs/STYLE-GUIDE.md repeats the total. Both
      # were once written by hand: the two totals drifted 750 apart
      # before anything compared them to a run. This step does.
      - name: Recorded alert counts
        run: node ts/scripts/vale-counts.cjs

      # Warnings and suggestions are reported for the author to read and
      # do not block; see the demotion notes in .vale.ini for what sits
      # at which level and why.
      - name: Full report (advisory)
        if: always()
        run: |
          {
            echo '## Prose report'
            echo
            echo 'Errors block the build. Warnings and suggestions do not.'
            echo
            echo '```'
            vale --no-exit --minAlertLevel=warning \
              $(node ts/scripts/gated-docs.cjs) 2>&1 | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
