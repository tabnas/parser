# Target: tabnas/parser -> .github/workflows/scorecard.yml
#
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [ main ]

permissions: read-all

jobs:
  scorecard:
    uses: tabnas/.github/.github/workflows/scorecard.yml@main
    permissions:
      security-events: write
      id-token: write
      contents: read
