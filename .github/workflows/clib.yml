# Staged per ADR-8: automation cannot push .github/workflows/*, so this
# file is written to <repo>/ci/clib.yml for a maintainer to promote via
# admin/rollout/apply-ci-folders.sh.
#
# tabnas-clib-template: v3
#
# PR gate for the clib: build the shared library on the portable lane's
# host and run the contract tests under -race. Artifact production for
# releases lives in the release workflow (strategy note §8), not here.
name: clib
on:
  pull_request:
    paths:
      - 'go/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go/go.mod
      - name: contract tests
        run: cd go/clib && go test -race ./...
      - name: host build
        run: cd go/clib && ./build.sh
