# Stamped by admin tasks/adopt-clib.sh (ADR-12) to ci/clib.yml, and
# promoted to .github/workflows/ by the restamp's own pull request or by
# admin rollout/apply-ci-folders.sh (ADR-8, as amended 2026-09-24).
#
# tabnas-clib-template: v5
#
# PR gate for the clib: build the shared library on the portable lane's
# host and run the contract tests under -race. Artifact production for
# releases lives in the release workflow (strategy note §8), not here.
name: clib
on:
  pull_request:
    paths:
      - 'go/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
      - name: contract tests
        run: cd go/clib && go test -race ./...
      - name: host build
        run: cd go/clib && ./build.sh
